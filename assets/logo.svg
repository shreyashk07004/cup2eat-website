<!-- REPLACE: recreated CUP2EAT badge. Swap for the owner's original logo file when available. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="CUP2EAT">
  <title>CUP2EAT logo</title>
  <defs>
    <radialGradient id="emerald" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1F6B52"/>
      <stop offset="60%" stop-color="#0E4A3A"/>
      <stop offset="100%" stop-color="#062820"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6E3A8"/>
      <stop offset="45%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#8C6A2F"/>
    </linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#emerald)" stroke="url(#gold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="0.75" opacity=".55"/>
  <g fill="url(#gold)" filter="url(#emboss)" font-family="Cinzel, 'Playfair Display', Georgia, serif" font-weight="800" text-anchor="middle">
    <text x="100" y="86" font-size="50" letter-spacing="1">CUP</text>
    <text x="100" y="116" font-size="24">2</text>
    <text x="100" y="160" font-size="50" letter-spacing="1">EAT</text>
    <rect x="48" y="106.5" width="40" height="1.6"/>
    <rect x="112" y="106.5" width="40" height="1.6"/>
    <circle cx="48" cy="107.3" r="3"/>
    <circle cx="152" cy="107.3" r="3"/>
  </g>
</svg>
